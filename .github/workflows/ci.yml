name: CI Gates & Bundle Hygiene

on:
  push:
    branches: [ main, master, fix/*, ai/*, ui/*, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Code Quality, Frozen Paths & Bundle Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architectural Boundary Linter
        run: node scripts/lint-boundaries.mjs

      - name: Frozen Paths Check
        run: |
          TRACK="R"
          if [[ "${{ github.ref }}" == *"ai/"* ]]; then TRACK="A"; fi
          if [[ "${{ github.ref }}" == *"ui/"* ]]; then TRACK="U"; fi
          if [[ "${{ github.ref }}" == *"functional"* ]]; then TRACK="F"; fi
          node scripts/check-frozen.mjs $TRACK

      - name: Typecheck
        run: npx tsc -b

      - name: Production Build & Client Bundle Audit
        run: npm run build

      - name: Headless Browser Smoke Test
        run: |
          npx playwright install --with-deps chromium
          node scripts/test_browser_boot.mjs

      - name: Web Crypto Security & Invariant Tests
        run: npx tsx scripts/test_web_crypto.ts

  android-build:
    name: Android Release Build Validation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web Client
        run: |
          npm ci
          npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Validate Gradle Release Assembly
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
